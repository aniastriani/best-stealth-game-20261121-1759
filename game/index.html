<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanterns of the Quiet Archive</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d13; }
  #game { position: fixed; inset: 0; margin: auto; max-width: 100vw; max-height: 100vh; width: auto; height: auto; display: block; touch-action: none; background: #20242e; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Lanterns of the Quiet Archive: sneak past the wardens, steal three sealed scrolls, and reach the exit unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
